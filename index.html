
<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CONTROL DE VACACIONES PMT</title>

<link rel="stylesheet" href="styles.css">

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

</head>

<body>

<div class="main-container">

    <div class="header">

        <div class="header-center">
            <h1>CONTROL DE VACACIONES PMT</h1>
            <h2>GESTIÓN DE PERSONAL</h2>
            <h3>PMT CHIMALTENANGO</h3>
        </div>

    </div>

    <div class="dashboard">

        <div class="card">
            <h3>VACACIONES ACTIVAS</h3>
            <span id="totalVacaciones">0</span>
        </div>

        <div class="card">
            <h3>PRÓXIMOS INGRESOS</h3>
            <span id="totalIngresos">0</span>
        </div>

        <div class="card">
            <h3>MANDOS</h3>
            <span id="totalMandos">0</span>
        </div>

    </div>

    <div class="buscador-section">

        <div class="buscador-box">

            <input
                type="text"
                id="busqueda"
                placeholder="Buscar por nombre o chapa..."
            >

        </div>

    </div>

    <div class="direccion-panel">

        <div class="panel-title">
            PERSONAL PMT
        </div>

        <div class="tabla-container">

            <table>

                <thead>

                    <tr>

                        <th>CHAPA</th>
                        <th>NOMBRE</th>
                        <th>CARGO</th>
                        <th>VACACIONES</th>
                        <th>SALE</th>
                        <th>INGRESA</th>

                    </tr>

                </thead>

                <tbody id="tabla"></tbody>

            </table>

        </div>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
