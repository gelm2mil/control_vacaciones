<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CONTROL Y REGISTRO PMT</title>

<link rel="stylesheet" href="styles.css">

<link rel="manifest" href="manifest.webmanifest">

<meta name="theme-color" content="#00e5ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PMT Control">

<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

</head>

<body>

<div class="main-container">

```
<!-- CABECERA -->

<header class="header">

    <div class="logo-box">

        <img
        src="icons/pmt.png"
        class="logo"
        alt="PMT">

    </div>

    <div class="header-center">

        <h1>
            CONTROL Y REGISTRO PMT
        </h1>

        <h2>
            GESTIÓN DE PERSONAL
        </h2>

        <h3>
            PMT CHIMALTENANGO 2026
        </h3>

    </div>

    <div class="logo-box">

        <img
        src="icons/icon-512.png"
        class="logo"
        alt="GELM">

    </div>

</header>

<!-- DASHBOARD -->

<section class="dashboard">

    <div class="card">
        <h3>VAC.AC.</h3>
        <span id="totalVacaciones">0</span>
    </div>

    <div class="card">
        <h3>F.INGR.</h3>
        <span id="totalIngresos">0</span>
    </div>

    <div class="card">
        <h3>PERS.AC.</h3>
        <span id="totalActivos">0</span>
    </div>

    <div class="card">
        <h3>MAND.AC.</h3>
        <span id="totalMandosActivos">0</span>
    </div>

    <div class="card">
        <h3>MAND.V.</h3>
        <span id="totalMandosVacaciones">0</span>
    </div>

    <div class="card">
        <h3>SUSP.</h3>
        <span id="totalSuspendidos">0</span>
    </div>

    <div class="card">
        <h3>TOTAL</h3>
        <span id="totalPersonal">0</span>
    </div>

</section>

<!-- BUSCADOR -->

<section class="buscador-section">

    <div class="buscador-box">

        <input
        type="text"
        id="busqueda"
        placeholder="Buscar por nombre, chapa o cargo...">

    </div>

</section>

<!-- TABLA PERSONAL -->

<section class="direccion-panel">

    <div class="panel-title">
        PERSONAL PMT
    </div>

    <div class="tabla-container">

        <table>

            <thead>

                <tr>

                    <th>CHAPA</th>
                    <th>NOMBRE</th>
                    <th>CARGO</th>
                    <th>VACACIONES</th>
                    <th>IGSS</th>
                    <th>SALE</th>
                    <th>INGRESA</th>

                </tr>

            </thead>

            <tbody id="tabla">

            </tbody>

        </table>

    </div>

</section>

<!-- FOOTER -->

<footer class="footer">

    <p>PMT CHIMALTENANGO 2026</p>

    <p>Sistema GELM - Control y Registro PMT</p>

</footer>
```

</div>

<script src="app.js"></script>

<script>

if ("serviceWorker" in navigator) {

    window.addEventListener("load", () => {

        navigator.serviceWorker
        .register("./sw.js")

        .then(() => {

            console.log(
                "Service Worker registrado"
            );

        })

        .catch(error => {

            console.error(
                "Error Service Worker:",
                error
            );

        });

    });

}

</script>

</body>
</html>
