<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CONTROL DE VACACIONES PMT</title>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:#0f172a;
    color:white;
    font-family:Arial,sans-serif;
    padding:20px;

}

.container{

    max-width:1400px;
    margin:auto;

}

h1{

    text-align:center;
    margin-bottom:20px;
    color:#00e5ff;

}

#busqueda{

    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    margin-bottom:20px;
    font-size:16px;

}

table{

    width:100%;
    border-collapse:collapse;
    background:#1e293b;

}

th{

    background:#00bcd4;
    color:black;
    padding:12px;

}

td{

    padding:12px;
    border-bottom:1px solid #334155;

}

tr:hover{

    background:#334155;

}

</style>

</head>

<body>

<div class="container">

<h1>CONTROL DE VACACIONES PMT</h1>

<input
type="text"
id="busqueda"
placeholder="Buscar por nombre o chapa..."

>

<table>

<thead>

<tr>

<th>CHAPA</th>
<th>NOMBRE</th>
<th>CARGO</th>
<th>SALE</th>
<th>INGRESA</th>

</tr>

</thead>

<tbody id="tabla"></tbody>

</table>

</div>

<script>

const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTsxA_1DCqrTBHMILm7bC3DRNTs5cLyJplztjRPvUyLLvJIvwbDSGrulY2CN9dcxQILbmTs_1yp5jAP/pub?gid=895287596&single=true&output=csv";

let personal = [];

window.addEventListener("DOMContentLoaded", () => {

    cargarDatos();

    document
    .getElementById("busqueda")
    .addEventListener("input", buscar);

});

async function cargarDatos(){

    const respuesta = await fetch(CSV_URL);

    const csv = await respuesta.text();

    Papa.parse(csv,{

        header:true,
        skipEmptyLines:true,

        complete:function(resultado){

            personal = resultado.data;

            render(personal);

        }

    });

}

function render(lista){

    const tabla =
    document.getElementById("tabla");

    tabla.innerHTML = "";

    lista.forEach(persona => {

        tabla.innerHTML += `

        <tr>

            <td>${persona.CHAPA || ""}</td>

            <td>${persona["PERSONAL PMT"] || ""}</td>

            <td>${persona.CARGO || ""}</td>

            <td>${persona.sale || ""}</td>

            <td>${persona.ingresa || ""}</td>

        </tr>

        `;

    });

}

function buscar(){

    const texto =
    document
    .getElementById("busqueda")
    .value
    .toUpperCase();

    const resultado =
    personal.filter(persona =>

        (persona.CHAPA || "")
        .toUpperCase()
        .includes(texto)

        ||

        (persona["PERSONAL PMT"] || "")
        .toUpperCase()
        .includes(texto)

    );

    render(resultado);

}

</script>

</body>

</html>
