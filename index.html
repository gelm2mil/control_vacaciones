<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CONTROL Y REGISTRO PMT</title>

<link rel="stylesheet" href="styles.css">

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

</head>
<body>

<div class="container">

    <!-- CABECERA -->

    <header class="hero">

        <img
        src="icons/pmt.png"
        alt="PMT"
        class="logo-pmt">

        <h1>
            CONTROL Y REGISTRO PMT
        </h1>

        <h2>
            GESTIÓN DE PERSONAL
        </h2>

        <h3>
            PMT CHIMALTENANGO 2026
        </h3>

    </header>

    <!-- RESUMEN -->

    <section class="resumen">

        <div class="card card-vacaciones">
            <span class="titulo-card">
                VAC.AC.
            </span>

            <span
            id="totalVacaciones"
            class="numero-card">
                0
            </span>
        </div>

        <div class="card card-ingresos">
            <span class="titulo-card">
                F.INGR.
            </span>

            <span
            id="totalIngresos"
            class="numero-card">
                0
            </span>
        </div>

        <div class="card card-activos">
            <span class="titulo-card">
                PERS.AC.
            </span>

            <span
            id="totalActivos"
            class="numero-card">
                0
            </span>
        </div>

        <div class="card card-mandos">
            <span class="titulo-card">
                MAND.AC.
            </span>

            <span
            id="totalMandosActivos"
            class="numero-card">
                0
            </span>
        </div>

        <div class="card card-mandos-v">
            <span class="titulo-card">
                MAND.V.
            </span>

            <span
            id="totalMandosVacaciones"
            class="numero-card">
                0
            </span>
        </div>

    </section>

    <!-- BUSCADOR -->

    <div class="buscador-box">

        <input
        type="text"
        id="busqueda"
        placeholder="Buscar por nombre o chapa...">

    </div>

    <!-- TABLA -->

    <section class="tabla-card">

        <h2 class="titulo-tabla">
            PERSONAL PMT
        </h2>

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>CHAPA</th>
                        <th>NOMBRE</th>
                        <th>CARGO</th>
                        <th>VACACIONES</th>
                        <th>IGSS</th>
                        <th>SALE</th>
                        <th>INGRESA</th>

                    </tr>

                </thead>

                <tbody id="tabla">

                </tbody>

            </table>

        </div>

    </section>

</div>

<script src="app.js"></script>

</body>
</html>
